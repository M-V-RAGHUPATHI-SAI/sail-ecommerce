<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .product-container {
            display: flex;
            justify-content: space-between;
            width: 100vw;
            height: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .image-gallery {
            display: flex;
            flex-direction: column;
            padding: 20px;
            margin: 0;
        }

        .image-gallery img {
            width: 70px;
            height: 70px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            transition: border-color 0.3s;
        }

        .image-gallery img:hover {
            border-color: #007bff;
        }

        .main-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-image img {
            width: 400px;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .product-info {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .product-info h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .rating {
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
        }

        .rating span:first-child {
            font-weight: bold;
            color: #ff9800;
        }

        .price {
            font-size: 24px;
            color: #b12704;
            margin-bottom: 10px;
        }

        .price .discount {
            text-decoration: line-through;
            color: #888;
            font-size: 16px;
            margin-left: 10px;
        }

        .size, .offers, .delivery {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        #size {
            padding: 8px;
            margin-left: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .offers h4, .delivery h4 {
            margin-bottom: 10px;
            color: #007bff;
        }

        .offers div, .delivery div {
            margin-bottom: 5px;
            color: #333;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .buttons button {
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            flex: 1;
        }

        .add-to-cart {
            background-color: #f0c14b;
            color: #111;
        }

        .buy-now {
            background-color: #ff9900;
            color: white;
        }

        .add-to-cart:hover {
            background-color: #ddb347;
        }

        .buy-now:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>

    <div class="product-container">
        <div class="image-gallery">
            <img src="images/pd12img1.jpg" alt="Thumbnail 1" onclick="changeImage('images/pd12img1.jpg')">
            <img src="images/pd12img2.jpg" alt="Thumbnail 2" onclick="changeImage('images/pd12img2.jpg')">
            <img src="images/pd12img3.jpg" alt="Thumbnail 3" onclick="changeImage('images/pd12img3.jpg')">
            <img src="images/pd12img4.jpg" alt="Thumbnail 4" onclick="changeImage('images/pd12img4.jpg')">
        </div>

        <div class="main-image" id="mainImageContainer">
            <img src="images/pd12img1.jpg" alt="Main Image" id="mainImage">
        </div>

        <div class="product-info">
            <h1>Allen Solly Men's T shirts</h1>
            <div class="rating">
                <span>4.6 ★</span>
                <span>(350 ratings)</span>
            </div>
            <div class="price">
                ₹499
                <span class="discount"> ₹999 </span>
            </div>

            <div class="size">
                <label for="size">Size:</label>
                <select id="size">
                    <option value="28">28</option>
                    <option value="30">30</option>
                    <option value="32" selected>32</option>
                    <option value="34">34</option>
                </select>
            </div>

            <div class="offers">
                <h4>Offers</h4>
                <div>Bank Offer: 10% Instant Discount on HDFC Bank Credit Cards</div>
                <div>Exchange Offer: Up to ₹600 off on exchange of old chinos</div>
            </div>

            <div class="delivery">
                <h4>Delivery</h4>
                <div>FREE delivery by 16th October </div>
                <div>Delivering to Goa 700001</div>
            </div>

            <div class="buttons">
                <button class="add-to-cart">Add to Cart</button>
                <button class="buy-now">Buy Now</button>
            </div>
        </div>
    </div>

    <script>
        function changeImage(imageUrl) {
            document.getElementById("mainImage").src = imageUrl;
        }
    </script>

</body>
</html>
