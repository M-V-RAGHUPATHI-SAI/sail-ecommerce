<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <style>
        footer {
            font-family: Arial, sans-serif;
        }

        .footer-section {
            background-color: lightgray;
        }

        footer h3 {
            font-size: 25px;
            margin-bottom: 20px;
            color: black;
        }

        footer ul {
            list-style-type: none;
            padding: 0;
        }

        footer ul li {
            margin-bottom: 10px;
        }

        footer ul li a {
            color: black;
            text-decoration: none;
            transition: color 0.3s;
        }

        footer ul li a:hover {
            text-decoration: underline;
        }

        .footer-section {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            padding-bottom: 30px;
        }

        .footer-section div {
            flex: 1;
            min-width: 180px;
            margin: 10px;
        }

        /* Style for copyright section */
        .footer-copyright {
            text-align: center;
            padding: 10px 0;
            color: #333;
            background-color:  lightgray;
        }

        .payment-social {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border: black;
        }

        .payment-methods img, .social-icons img {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            transition: transform 0.3s, filter 0.3s;
        }

        .payment-methods img:hover, .social-icons img:hover {
            transform: scale(1.1);
            filter: grayscale(0);
        }

        @media (max-width: 768px) {
            .footer-section {
                flex-direction: column;
                align-items: center;
            }

            .payment-social {
                flex-direction: column;
                background-color: white;
            }

            .payment-methods {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <footer>
        <div class="footer-section">
            <div>
                <h3>Help</h3>
                <ul>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Orders</a></li>
                    <li><a href="#">Delivery Information</a></li>
                    <li><a href="#">Returns Policy</a></li>
                    <li><a href="#">Make A Return</a></li>
                    <li><a href="#">Submit a Fake</a></li>
                </ul>
            </div>
            <div>
                <h3>My Account</h3>
                <ul>
                    <li><a href="#">Login</a></li>
                    <li><a href="#">Sign-up</a></li>
                </ul>
            </div>
            <div>
                <h3>Pages</h3>
                <ul>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="#">Careers</a></li>
                    <li><a href="#">Factory List</a></li>
                </ul>
            </div>
        </div>

        
        <div class="footer-copyright">
            <p>&copy; 2024 Sail. All rights reserved.</p>
        </div>

        <div class="payment-social">
            <div class="payment-methods">
                <img src="images/visa.svg" alt="Visa">
                <img src="images/mastercard.svg" alt="Mastercard">
                <img src="images/upi.png" alt="UPI">
            </div>
            <div class="social-icons">
                <a href="#"><img src="images/facebook.jpg" alt="Facebook"></a>
                <a href="#"><img src="images/instagram.jpeg" alt="Instagram"></a>
                <a href="#"><img src="images/youtibe.jpeg" alt="YouTube"></a>
                <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
                <a href="#"><img src="images/linkedin.jpg" alt="LinkedIn"></a>
            </div>
        </div>
    </footer>
</body>
</html>
